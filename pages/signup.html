<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernova — إنشاء حساب</title><link rel="stylesheet" href="../css/main.css"><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#3843b5"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html">Ler<span>nova</span></a><a class="btn ghost" href="../index.html">الرئيسية</a></div></header><main class="container auth"><section class="card auth-card"><h1>إنشاء حساب</h1><p class="muted">أنشئ حسابًا لحفظ تقدمك ومزامنته.</p><form id="signupForm"><label for="username">اسم المستخدم</label><input class="field" id="username" autocomplete="nickname" required><label for="email">البريد الإلكتروني</label><input class="field" id="email" type="email" autocomplete="email" required><label for="password">كلمة المرور</label><input class="field" id="password" type="password" autocomplete="new-password" minlength="8" required><button class="btn primary" id="go">إنشاء الحساب</button></form><div class="auth-divider"><span>أو</span></div><button class="btn google-btn" id="googleLogin" type="button"><span class="google-mark">G</span> التسجيل باستخدام Google</button><p id="msg" role="status"></p><a href="login.html">لدي حساب بالفعل</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>const authClient=LernovaAuth.init();document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');if(!authClient){msg.textContent='لربط الحساب، ضع رابط Supabase ومفتاح النشر في js/config.js.';return}const button=document.getElementById('go');button.disabled=true;try{const {error}=await LernovaAuth.signUp(document.getElementById('email').value,document.getElementById('password').value,document.getElementById('username').value.trim());if(error)throw error;msg.textContent='تم إنشاء الحساب. راجع بريدك إذا كان تأكيد البريد مفعّلًا.'}catch(error){msg.textContent=error.message||'تعذّر إنشاء الحساب.'}finally{button.disabled=false}})</script><script>document.getElementById("googleLogin").addEventListener("click",async()=>{const msg=document.getElementById("msg"),button=document.getElementById("googleLogin");if(!LernovaAuth.init()){msg.textContent="تعذّر الاتصال بإعدادات تسجيل الدخول.";return}button.disabled=true;try{const {error}=await LernovaAuth.signInWithGoogle();if(error)throw error}catch(error){msg.textContent=error.message||"تعذّر بدء التسجيل باستخدام Google.";button.disabled=false}})</script><script src="../js/sync.js"></script><script src="../js/language.js"></script>
<script src="../js/profile-ui.js"></script>
</body></html>
