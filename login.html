<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernova — تسجيل الدخول</title><link rel="stylesheet" href="../css/main.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html">Ler<span>nova</span></a><a class="btn ghost" href="../index.html">الرئيسية</a></div></header><main class="container auth"><section class="card auth-card"><h1>تسجيل الدخول</h1><p class="muted">تابع الكلمات والمراجعة من حسابك.</p><form id="loginForm"><label for="email">البريد الإلكتروني</label><input class="field" id="email" type="email" autocomplete="email" required><label for="password">كلمة المرور</label><input class="field" id="password" type="password" autocomplete="current-password" required><button class="btn primary" id="go">دخول</button></form><p id="msg" role="status"></p><a href="signup.html">إنشاء حساب جديد</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>const authClient=LernovaAuth.init();document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');if(!authClient){msg.textContent='لربط الحساب، ضع رابط Supabase ومفتاح النشر في js/config.js.';return}const button=document.getElementById('go');button.disabled=true;try{const {error}=await LernovaAuth.signIn(document.getElementById('email').value,document.getElementById('password').value);if(error)throw error;await LernovaSync.mergeLocal();await LernovaSync.load();msg.textContent='تم تسجيل الدخول ✓';setTimeout(()=>location.href='../index.html',400)}catch(error){msg.textContent=error.message||'تعذّر تسجيل الدخول.'}finally{button.disabled=false}})</script><script src="../js/sync.js"></script><script src="../js/language.js"></script>
<script src="../js/profile-ui.js"></script>
</body></html>
