<main class="container"><section class="hero"><p class="eyebrow">Netzwerk neu A1</p><h1>📘 قواعد كل Kapitel</h1><p>رتبت القواعد وأمثلتها على حسب فصول الكتاب، مع تركيز مطابق للملخصات الظاهرة في صور أول ستة فصول.</p><label class="field-label chapter-filter">الفصل<select class="field" id="chapterFilter"><option value="all">كل الفصول</option></select></label></section><section class="cards grammar-list" id="grammarCards"></section></main>

<script>
const lessons={
1:[['السؤال بـ W-Frage','أداة السؤال ثم الفعل ثم الفاعل.','Wo wohnst du? — Ich wohne in Kairo.','أين تسكن؟ — أسكن في القاهرة.'],['التعريف بالنفس والأفعال','sein: ich bin, du bist, er/sie ist, wir sind. heißen: ich heiße, du heißt.','Ich heiße Mohammed. Ich komme aus Ägypten.','اسمي محمد. أنا من مصر.'],['اللغات والأرقام','أسماء اللغات تُكتب بحرف كبير، وتأتي غالبًا من دون Artikel بعد sprechen.','Ich spreche Arabisch und Deutsch.','أتحدث العربية والألمانية.']],
2:[['تصريف الفعل والضمائر','النهايات غالبًا: ‎-e, ‎-st, ‎-t, ‎-en, ‎-t, ‎-en.','Ich spiele gern Fußball. Du spielst gern Fußball.','أحب لعب كرة القدم. أنت تحب لعب كرة القدم.'],['الأفعال sein وhaben','sein: bin, bist, ist, sind, seid, sind. haben: habe, hast, hat, haben, habt, haben.','Ich bin Student und habe heute Zeit.','أنا طالب ولدي وقت اليوم.'],['سؤال نعم/لا وArtikel والجمع','يبدأ السؤال بالفعل. احفظ الاسم مع der/die/das والجمع.','Hast du Geschwister? — Ja, ich habe zwei Brüder.','هل لديك إخوة؟ — نعم، لدي أخوان.']],
3:[['ein/eine وkein/keine','نستخدم ein/eine للاسم النكرة، وkein/keine لنفي الاسم.','Das ist ein Hotel. Das ist keine Kirche.','هذا فندق. هذه ليست كنيسة.'],['صيغة الأمر الرسمية Sie','الفعل ثم Sie، مع علامة التعجب عند الطلب.','Gehen Sie geradeaus und dann links!','اذهب إلى الأمام ثم يسارًا من فضلك.'],['الصفة مع sein','بعد sein تأتي الصفة بصيغتها الأساسية.','Der Hafen ist groß. Die Straße ist breit.','الميناء كبير. الشارع عريض.']],
4:[['Akkusativ','يتغير Artikel المذكر: der → den، وein → einen. المؤنث والمحايد لا يتغيران هنا.','Ich kaufe den Käse und eine Banane.','أشتري الجبن وموزة.'],['mögen وmöchten','mögen للتفضيل، وmöchten لطلب مهذب.','Ich mag Tee. Ich möchte einen Kaffee, bitte.','أحب الشاي. أريد قهوة من فضلك.'],['ترتيب الجملة','يمكن وضع ظرف الوقت أولًا، ويبقى الفعل المصرف في المركز الثاني.','Morgens trinke ich Kaffee.','أشرب القهوة في الصباح.']],
5:[['am وum وvon … bis','am مع أيام الأسبوع، um مع الساعة، von … bis للفترة.','Am Montag arbeite ich von neun bis fünf.','أعمل يوم الاثنين من التاسعة حتى الخامسة.'],['Possessivartikel','يتغير mein/dein حسب جنس الاسم وحالته.','Das ist mein Vater. Ich besuche meine Mutter.','هذا أبي. أزور أمي.'],['Modalverben','الفعل الناقص في المركز الثاني، والمصدر في آخر الجملة.','Ich muss früh aufstehen. Wir wollen heute telefonieren.','يجب أن أستيقظ مبكرًا. نريد التحدث هاتفيًا اليوم.']],
6:[['التاريخ والترتيب','يأتي am مع التاريخ والترتيب: am ersten Mai، am zweiten Juni.','Mein Geburtstag ist am dritten Mai.','عيد ميلادي في الثالث من مايو.'],['الأفعال المنفصلة','يبقى الجزء الأول في آخر الجملة.','Ich lade meine Freunde ein. Wir holen dich ab.','أدعو أصدقائي. سنأتي لاصطحابك.'],['Akkusativ وfür','ضمائر المفعول: mich, dich, ihn, sie, es, uns, euch, sie. für يأخذ Akkusativ.','Das Geschenk ist für dich. Er ruft mich an.','هذه الهدية لك. هو يتصل بي.'],['Präteritum من haben وsein','الأشكال المهمة: ich hatte، du hattest، er hatte؛ ich war، du warst، er war.','Gestern war ich zu Hause und hatte Zeit.','كنت في المنزل أمس وكان لدي وقت.']],
7:[['Modalverben','können, müssen, wollen مع الفعل الأساسي في نهاية الجملة.','Ich kann heute länger arbeiten.','أستطيع العمل مدة أطول اليوم.']],
8:[['الأفعال المنفصلة','الفعل المصرف في المركز الثاني والبادئة المنفصلة في النهاية.','Der Unterricht fängt um neun Uhr an.','يبدأ الدرس الساعة التاسعة.']],
9:[['ترتيب الجملة والوقت','يبقى الفعل في المركز الثاني حتى عندما تبدأ الجملة بالوقت.','Am Wochenende besuche ich meine Familie.','أزور عائلتي في عطلة نهاية الأسبوع.']],
10:[['Perfekt','يتكون غالبًا من haben/sein مع Partizip II في آخر الجملة.','Ich habe Deutsch gelernt. Wir sind nach Berlin gefahren.','تعلمت الألمانية. سافرنا إلى برلين.']],
11:[['الملكية في الجملة','اختر mein/dein/sein/ihr حسب صاحب الشيء وجنس الاسم.','Ist das deine Jacke? — Nein, das ist seine Jacke.','هل هذه سترتك؟ — لا، هذه سترته.']],
12:[['حروف الجر الشائعة','احفظ حرف الجر ضمن جملة قصيرة، وانتبه إلى الحالة التي يأتي معها.','Ich fahre mit dem Zug. Das Geschenk ist für dich.','أسافر بالقطار. هذه الهدية لك.']]
};
const select=document.getElementById('chapterFilter'),host=document.getElementById('grammarCards'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
LERNOVA.chapters().forEach(c=>select.add(new Option(`Kapitel ${c.id} — ${c.title}`,String(c.id))));
function render(){const ids=select.value==='all'?LERNOVA.chapters().map(c=>c.id):[Number(select.value)];host.innerHTML=ids.flatMap(id=>(lessons[id]||[]).map((item,i)=>`<article class="card"><small class="muted">Kapitel ${id} · ${esc(LERNOVA.chapterTitles[id])}</small><h3>${i+1}. ${esc(item[0])}</h3><p>${esc(item[1])}</p><div class="sentence"><b>${esc(item[2])}</b><small>${esc(item[3])}</small></div></article>`)).join('')}
select.addEventListener('change',render);render();
</script><script src="../js/language.js"></script>
