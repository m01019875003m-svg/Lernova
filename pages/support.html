<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lernova - الدعم والشكاوى</title><link rel="stylesheet" href="../css/main.css"></head><body><main class="container"><nav><a href="../index.html">الرئيسية</a></nav><section class="card"><h1>الدعم والشكاوى</h1><p>اكتب اقتراحك أو المشكلة التي واجهتك.</p><textarea id="text" rows="8" placeholder="اكتب هنا..."></textarea><button onclick="send()">حفظ الرسالة</button><p id="msg"></p></section></main><script>function send(){const v=text.value.trim();if(!v){msg.textContent='اكتب الرسالة أولًا.';return}const list=JSON.parse(localStorage.getItem('lernovaSupport')||'[]');list.push({text:v,date:new Date().toISOString()});localStorage.setItem('lernovaSupport',JSON.stringify(list));text.value='';msg.textContent='تم حفظ الرسالة على الجهاز ✓'}</script><script src="../js/language.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script>
<script src="../js/profile-ui.js"></script>
</body></html>
