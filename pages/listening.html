<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5bd6"><link rel="stylesheet" href="../css/main.css"><title>Lernova — تدريب الاستماع</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#3843b5"></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="../index.html">Ler<span>nova</span></a><a class="btn ghost" href="quiz.html?mode=listen">اختبار استماع</a></div></header>
<main class="container"><section class="hero"><h1>🎧 تدريب الاستماع</h1><p>اختار فصلًا معينًا أو كل الفصول. استمع للجملة وحاول فهمها قبل إظهار الترجمة.</p><div class="toolbar"><label class="field-label">الفصل<select class="field" id="chapter"></select></label><button class="btn primary" id="next">جملة جديدة</button></div><p class="muted" id="deckInfo" aria-live="polite"></p></section><article class="review-card" id="listeningCard"></article></main>
<script src="../data/a1.js"></script><script src="../js/storage.js"></script><script src="../js/core.js"></script>
<script>
const host=document.getElementById('listeningCard'),chapter=document.getElementById('chapter'),deckInfo=document.getElementById('deckInfo');let deck=[],current=null,seen=0;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
chapter.add(new Option('كل الفصول','all'));LERNOVA.chapters().forEach(c=>chapter.add(new Option(`Kapitel ${c.id} — ${c.title}`,String(c.id))));
const params=new URLSearchParams(location.search),requested=params.get('chapter');if(requested==='all'||LERNOVA.chapters().some(c=>String(c.id)===requested))chapter.value=requested;
function resetDeck(){const words=LERNOVA.words.filter(w=>w.sentence&&(chapter.value==='all'||w.chapter===Number(chapter.value)));deck=words.sort(()=>Math.random()-.5);seen=0;}
function next(){if(!deck.length)resetDeck();if(!deck.length){host.innerHTML='<p>لا توجد جمل في هذا الفصل حتى الآن.</p>';return}current=deck.pop();seen++;deckInfo.textContent=`الجملة ${seen} من ${seen+deck.length} قبل إعادة الترتيب.`;host.innerHTML=`<span class="counter">Kapitel ${current.chapter} · ${esc(current.category)}</span><h2>اسمع وحاول أن تفهم</h2><button class="speak-big" id="play" aria-label="تشغيل الجملة">🔊</button><p><button class="btn ghost" id="reveal">إظهار الجملة والترجمة</button></p><div id="answer" hidden><div class="sentence"><b>${esc(current.sentence)}</b><br><small>${esc(current.sentenceArabic)}</small></div><p class="arabic">${esc(current.article?current.article+' ':'')}${esc(current.german)} — ${esc(current.arabic)}</p></div><div class="review-actions"><button class="btn primary" id="heard">سمعتها بوضوح · +1 XP</button><button class="btn ghost" id="nextSentence">جملة أخرى</button></div>`;document.getElementById('play').onclick=()=>LERNOVA.speak(current.sentence);document.getElementById('reveal').onclick=()=>document.getElementById('answer').hidden=false;document.getElementById('heard').onclick=()=>{LernovaStore.addXP(1);next()};document.getElementById('nextSentence').onclick=next;LERNOVA.speak(current.sentence)}
chapter.onchange=()=>{resetDeck();next()};document.getElementById('next').onclick=next;resetDeck();next();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="../js/sync.js"></script><script src="../js/language.js"></script>
<script src="../js/profile-ui.js"></script>
</body></html>
