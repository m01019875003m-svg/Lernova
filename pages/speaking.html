<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5bd6"><link rel="stylesheet" href="../css/main.css"><title>Lernova — التحدث والمحادثة</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#3843b5"></head><body>
<header class="topbar"><div class="container nav"><a class="brand" href="../index.html">Ler<span>nova</span></a><a class="btn ghost" href="quiz.html">الاختبارات</a></div></header>
<main class="container"><section class="hero"><h1>🗣️ تدريب التحدث والمحادثة</h1><p>اختار Kapitel بعينه أو كل الفصول، وتمرّن على نطق الجمل أو حوار قصير.</p><div class="toolbar"><label class="field-label">الفصل<select class="field" id="chapter"></select></label><label class="field-label">نوع التدريب<select class="field" id="activity"><option value="repeat">تكرار جمل</option><option value="dialogue">محادثة قصيرة</option></select></label><button class="btn primary" id="next">تدريب جديد</button></div></section><article class="review-card" id="speakingCard"></article></main>
<script src="../data/a1.js"></script><script src="../data/conversations-a1.js"></script><script src="../js/core.js"></script><script src="../js/storage.js"></script>
<script>
const host=document.getElementById('speakingCard'),chapter=document.getElementById('chapter'),activity=document.getElementById('activity');let deck=[],current=null,recognition=null;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
chapter.add(new Option('كل الفصول','all'));LERNOVA.chapters().forEach(c=>chapter.add(new Option(`Kapitel ${c.id} — ${c.title}`,String(c.id))));
const params=new URLSearchParams(location.search),requested=params.get('chapter');if(requested==='all'||LERNOVA.chapters().some(c=>String(c.id)===requested))chapter.value=requested;
function resetDeck(){const source=activity.value==='dialogue'?window.LERNOVA_DIALOGUES:LERNOVA.words.filter(w=>w.sentence);deck=source.filter(x=>(chapter.value==='all'||x.chapter===Number(chapter.value))&&(activity.value==='dialogue'||x.sentence)).sort(()=>Math.random()-.5)}
function next(){if(!deck.length)resetDeck();if(!deck.length){host.innerHTML='<p>لا يوجد محتوى متاح في الاختيار ده.</p>';return}current=deck.pop();if(activity.value==='dialogue')renderDialogue();else renderRepeat()}
function renderRepeat(){host.innerHTML=`<span class="counter">Kapitel ${current.chapter} · ${esc(current.category)}</span><h2>اسمع الجملة ثم كررها</h2><div class="sentence"><b>${esc(current.sentence)}</b><br><small>${esc(current.sentenceArabic)}</small></div><div class="review-actions"><button class="speak-big" id="play" aria-label="تشغيل النطق">🔊</button><button class="btn primary" id="speak">🎙️ ابدأ التسجيل</button><button class="btn ghost" id="nextSentence">جملة جديدة</button></div><p id="result" class="arabic" role="status"></p>`;document.getElementById('play').onclick=()=>LERNOVA.speak(current.sentence);document.getElementById('speak').onclick=()=>listen(current.sentence);document.getElementById('nextSentence').onclick=next;LERNOVA.speak(current.sentence)}
function renderDialogue(){host.innerHTML=`<span class="counter">Kapitel ${current.chapter} · ${esc(current.scene)}</span><h2>دورك ترد على المحادثة</h2><div class="sentence"><b>A: ${esc(current.a)}</b><br><small>${esc(current.aAr)}</small></div><div class="review-actions"><button class="btn ghost" id="playDialog">🔊 اسمع السؤال</button><button class="btn primary" id="speak">🎙️ قل إجابتك</button><button class="btn ghost" id="showReply">إظهار رد مقترح</button><button class="btn ghost" id="nextDialog">محادثة أخرى</button></div><div id="suggestion" class="sentence" hidden><b>B: ${esc(current.b)}</b><br><small>${esc(current.bAr)}</small></div><p id="result" class="arabic" role="status"></p>`;document.getElementById('playDialog').onclick=()=>LERNOVA.speak(current.a);document.getElementById('speak').onclick=()=>listen(current.reply);document.getElementById('showReply').onclick=()=>document.getElementById('suggestion').hidden=false;document.getElementById('nextDialog').onclick=next;LERNOVA.speak(current.a)}
function listen(expected){const result=document.getElementById('result'),API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){result.textContent='التعرّف على الكلام غير متاح في هذا المتصفح. كرر الجملة أو الحوار بصوت عالٍ، ثم انتقل للتدريب التالي.';return}recognition=new API();recognition.lang='de-DE';recognition.interimResults=false;recognition.maxAlternatives=1;result.textContent='اتكلم بالألمانية الآن…';recognition.onresult=e=>{const heard=e.results[0][0].transcript;const clean=s=>s.toLocaleLowerCase().normalize('NFC').replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim();const ok=clean(heard)===clean(expected);result.textContent=ok?`ممتاز! نطقك مطابق للجملة ✓ (${heard})`:`سمعت: ${heard}. قارن إجابتك بالمثال وحاول مرة أخرى.`;if(ok)window.LernovaStore?.addXP(2)};recognition.onerror=()=>result.textContent='لم أتمكن من سماعك. تأكد من السماح للميكروفون وحاول ثانية.';recognition.start()}
chapter.onchange=()=>{resetDeck();next()};activity.onchange=()=>{resetDeck();next()};document.getElementById('next').onclick=next;resetDeck();next();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="../js/sync.js"></script><script src="../js/language.js"></script>
<script src="../js/profile-ui.js"></script>
</body></html>
